name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Contract and generator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -W error -m unittest discover -s tests -v
      - name: Verify deterministic reference generation
        env:
          PYTHONPATH: src
        run: >-
          python -m churn_platform.cli
          --customers 12
          --days 60
          --seed 2027
          --output build/customer_events.ndjson
      - name: Audit tracked publication content
        run: python scripts/audit-publication.py
