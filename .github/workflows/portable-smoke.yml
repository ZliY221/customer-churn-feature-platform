name: Portable smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-model-flow:
    name: ${{ matrix.os }} portable model flow
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Bootstrap the isolated runtime and run the public quickstart
        run: >-
          python scripts/bootstrap.py
          --
          --output-dir build/portable
      - name: Reuse the isolated runtime
        run: >-
          python scripts/bootstrap.py
          --
          --output-dir build/portable
