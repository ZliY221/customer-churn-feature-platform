name: Portable smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-model-flow:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} portable model flow
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Bootstrap the isolated runtime and run the public quickstart
        run: >-
          python scripts/bootstrap.py
          --
          --output-dir build/portable
      - name: Reuse the isolated runtime
        run: >-
          python scripts/bootstrap.py
          --
          --output-dir build/portable
