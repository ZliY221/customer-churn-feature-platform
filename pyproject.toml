[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-feature-platform"
version = "2.3.0"
description = "Customer churn feature platform and retention operations workflow"
requires-python = ">=3.11"

[project.scripts]
generate-customer-events = "churn_platform.cli:main"
build-customer-features = "churn_platform.feature_cli:main"
train-churn-baseline = "churn_platform.training_cli:main"
predict-customer-churn = "churn_platform.inference_cli:main"
monitor-churn-drift = "churn_platform.drift_cli:main"
monitor-churn-performance = "churn_platform.performance_cli:main"
compare-churn-models = "churn_platform.comparison_cli:main"
run-churn-demo = "churn_platform.demo_cli:main"
check-feature-parity = "churn_platform.feature_registry_cli:main"

[project.optional-dependencies]
api = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
]
test = [
    "httpx2==2.13.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
churn_platform = ["static/*"]

[tool.ruff]
line-length = 100
