[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-feature-platform"
version = "0.1.0"
description = "Reproducible customer behavior features and churn prediction pipeline"
requires-python = ">=3.11"

[project.scripts]
generate-customer-events = "churn_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
